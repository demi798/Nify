# Nify 前端 Nginx：静态资源 + /api 反代后端
# 约定：后端在 Docker 网络中服务名为 backend:8080（可用自定义镜像覆盖本文件）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积（知识库文档）
    client_max_body_size 50m;

    # 静态资源长缓存（带 hash 的产物）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API / SSE：关闭缓冲、拉长超时，避免流式对话被 Nginx 截断
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Workspace-Id $http_x_workspace_id;

        # SSE / 流式：禁止缓冲、缓存与 gzip（gzip 会攒包破坏流式）
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
        # 告知上游/中间层不要缓冲（部分代理认此头）
        add_header X-Accel-Buffering no always;

        # LLM 调用可能很慢；与后端 NIFY_LLM_TOTAL_TIMEOUT_SEC（默认 300s）对齐并留余量
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # SPA：前端路由交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
