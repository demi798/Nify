[project]
name = "nify"
version = "0.1.0"
description = "Nify — 内部 AI Agent 开发平台（模块化单体）"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Nify" }]

# 运行时依赖统一在此声明（≈ Maven 父 POM dependencyManagement）
# 业务模块间依赖不走 packaging，而按 CLAUDE.md 白名单只 import 对方 XxxService：
#   identity / model_provider / mcp  → （无业务依赖）
#   knowledge                       → model_provider
#   agent                           → model_provider, knowledge, mcp
#   conversation / workflow         → model_provider, knowledge, mcp, agent
dependencies = [
  # Web
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "python-multipart>=0.0.12,<1.0.0",

  # 配置与校验
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",

  # MySQL
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncmy>=0.2.9,<1.0.0",
  "pymysql>=1.1.0,<2.0.0",
  "alembic>=1.14.0,<2.0.0",

  # Redis（队列 / 限流）
  "redis>=5.2.0,<6.0.0",

  # HTTP / LLM 客户端（经 model_provider.LLMGateway 统一出口）
  "httpx>=0.28.0,<1.0.0",
  "openai>=1.55.0,<2.0.0",
  "anthropic>=0.39.0,<1.0.0",
  "google-genai>=1.0.0,<2.0.0",

  # Milvus
  "pymilvus>=2.4.0,<3.0.0",

  # 安全
  "PyJWT>=2.9.0,<3.0.0",
  "bcrypt>=4.2.0,<5.0.0",
  "cryptography>=43.0.0,<45.0.0",

  # 工具
  "uuid6>=2024.7.10",
  "tenacity>=9.0.0,<10.0.0",
  "orjson>=3.10.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "ruff>=0.8.0,<1.0.0",
  "mypy>=1.13.0,<2.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
